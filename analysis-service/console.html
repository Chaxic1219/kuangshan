<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>矿山视界 · 视频智能分析</title><link rel="stylesheet" href="/console.css"></head>
<body>
<aside class="sidebar"><div class="brand"><div class="mark">◈</div><div><b>矿山视界</b><small>MINE VISION</small></div></div><div class="navtitle">监测工作台</div><nav><button class="navitem active" data-page="cameras"><span>▦</span><span>视频管理</span></button><button class="navitem" data-page="monitor"><span>◉</span><span>实时监控</span></button><button class="navitem" data-page="models"><span>◇</span><span>场景模型</span></button><button class="navitem" data-page="alerts"><span>▤</span><span>事件记录</span></button></nav><footer><span class="dot"></span>本地计算 · 画面不上传云端<br>YOLO / OpenCV<br><span id="side-status">正在连接服务</span></footer></aside>
<main class="main"><header class="topbar"><span>安全监测中心 &nbsp; / &nbsp; <strong id="breadcrumb">视频管理</strong></span><span class="localtag">● 本地推理服务</span></header><div class="heading"><div><div class="eyebrow">VIDEO INTELLIGENCE / 工作空间</div><h1 id="title">每一路画面，都有守护</h1><p id="subtitle">连接视频，配置场景，让风险被及时看见。</p></div><button class="primary" id="add-camera">＋ 添加视频</button></div><section class="stats"><div class="stat"><div><span>已配置视频</span><strong id="stat-total">—</strong></div><i>▦</i></div><div class="stat"><div><span>运行中视频</span><strong id="stat-running">—</strong></div><i>◉</i></div><div class="stat"><div><span>已绑定场景</span><strong id="stat-tasks">—</strong></div><i>◇</i></div><div class="stat"><div><span>累计报警事件</span><strong id="stat-alerts">—</strong></div><i>↗</i></div><div class="stat"><div><span>分析进程资源</span><strong id="stat-resource">—</strong></div><i>◎</i></div></section><div class="toolbar"><div><b id="section-title">视频资源</b> <span class="hint" id="section-hint">配置与监测状态</span></div><input id="search" aria-label="搜索视频或事件" placeholder="搜索名称、位置或事件"></div><section id="content" class="grid"></section></main>
<dialog id="editor"><header class="modalhead"><div><h2 id="editor-title">添加视频</h2><p class="small">从接入到布控，完成一条视频的检测配置</p></div><button class="close" aria-label="关闭配置" id="editor-close">×</button></header><div class="steps"><div class="step" data-step="0"><b>01</b>视频接入</div><div class="step" data-step="1"><b>02</b>场景选择</div><div class="step" data-step="2"><b>03</b>参数配置</div><div class="step" data-step="3"><b>04</b>区域布控</div></div><div class="modalcontent" id="editor-content"></div><footer class="modalfoot"><div id="editor-error" class="errorbar" role="alert"></div><div class="buttons"><button id="previous">上一步</button><button class="primary" id="next">下一步</button></div></footer></dialog>
<dialog id="viewer"><header class="modalhead"><div><h2 id="viewer-title">视频监控</h2><p class="small" id="viewer-subtitle"></p></div><button id="viewer-preview" hidden>原视频预览</button><button class="close" id="viewer-close" aria-label="关闭画面">×</button></header><div class="modalcontent"><div class="viewmeta" id="viewer-meta"></div><div id="viewer-stage"></div><div id="viewer-detail" class="notice"></div></div></dialog>
<div id="toast" class="toast" role="status" hidden></div><script src="/console.js" defer></script></body></html>
